name: LINCUKOO LPPA OpenThread RCP
device: EFR32MG21A020F768IM32
base_project: src/openthread_rcp
filename: "{manifest_name}_{sdk_version}_{fw_version}_{baudrate}_{fw_variant}"
sdk: "simplicity_sdk:2026.6.1"
toolchain: "gcc:14.2.1"

gbl:
  fw_type: openthread_rcp
  baudrate: 460800
  fw_variant: no_flow

add_components:
  # PA configuration is not part of the base project; adding it exposes
  # SL_RAIL_UTIL_PA_* so the low-power amplifier path can be selected.
  - id: rail_util_pa

c_defines:
  SL_IOSTREAM_USART_VCOM_BAUDRATE: 460800
  SL_IOSTREAM_USART_VCOM_FLOW_CONTROL_TYPE: uartFlowControlNone

  SL_IOSTREAM_USART_VCOM_PERIPHERAL: USART0
  SL_IOSTREAM_USART_VCOM_PERIPHERAL_NO: 0

  SL_IOSTREAM_USART_VCOM_TX_PORT: SL_GPIO_PORT_B
  SL_IOSTREAM_USART_VCOM_TX_PIN: 1

  SL_IOSTREAM_USART_VCOM_RX_PORT: SL_GPIO_PORT_B
  SL_IOSTREAM_USART_VCOM_RX_PIN: 0

  SL_IOSTREAM_USART_VCOM_CTS_PORT: 0
  SL_IOSTREAM_USART_VCOM_CTS_PIN: 0

  SL_IOSTREAM_USART_VCOM_RTS_PORT: 0
  SL_IOSTREAM_USART_VCOM_RTS_PIN: 0

  SL_CLOCK_MANAGER_HFXO_CTUNE: 128

  SL_RAIL_UTIL_RSSI_OFFSET: -11

  # The experiment: use the low-power PA path instead of the SDK default
  # high-power one, cutting peak transmit current draw.
  SL_RAIL_UTIL_PA_SELECTION_2P4GHZ: RAIL_TX_POWER_MODE_2P4GIG_LP
  SL_RAIL_UTIL_PA_POWER_DECI_DBM: 0
  SL_RAIL_UTIL_PA_RAMP_TIME_US: 10
  SL_RAIL_UTIL_PA_VOLTAGE_MV: 1800

sdk_patches:
  - enable-greenpower-without-multipan.patch
